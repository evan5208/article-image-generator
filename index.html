<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Gemini Image Proxy Demo</title>
    <style>
        body { font-family: system-ui, -apple-system, Arial; padding: 16px; }
        textarea { width: 100%; height: 140px; }
        button { padding: 10px 14px; margin-top: 10px; }
        pre { background: #f6f6f6; padding: 12px; overflow: auto; }
        img { max-width: 100%; margin-top: 12px; border: 1px solid #ddd; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        select { padding: 8px; }
    </style>
</head>
<body>
    <h2>Gemini Image (via Local Proxy)</h2>
    <div class="row">
        <button id="btnHealth">检查后端/Key</button>
        <button id="btnLoadModels">加载模型列表</button>
        <label>选择模型：
            <select id="modelSelect"></select>
        </label>
    </div>
    <p>Prompt：</p>
    <textarea id="prompt">生成一张 16:9 的未来城市夜景，霓虹灯，赛博朋克风。</textarea>
    <br/>
    <button id="btnGen">生成</button>
    <p>日志：</p>
    <pre id="log"></pre>
    <p>结果：</p>
    <img id="out" alt="generated image"/>
    <script>
        const API_BASE = "http://127.0.0.1:8787";
        const logEl = document.getElementById("log");
        const imgEl = document.getElementById("out");
        const modelSel = document.getElementById("modelSelect");
        
        function log(...args) {
            logEl.textContent += args.map(a => typeof a === "string" ? a : JSON.stringify(a, null, 2)).join(" ") + " ";
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        async function http(path, options) {
            const r = await fetch(API_BASE + path, options);
            const t = await r.text();
            if (!r.ok) throw new Error(`${path} ${r.status}: ${t}`);
            return t;
        }
        
        async function health() {
            const t = await http("/api/health");
            log("health:", t);
        }
        
        async function listModels() {
            const t = await http("/api/models");
            const data = JSON.parse(t);
            const models = data.models || [];
            log(`models count: ${models.length}`);
            models.sort((a,b) => {
                const A = /image|vision|preview/i.test(a.name) ? 0 : 1;
                const B = /image|vision|preview/i.test(b.name) ? 0 : 1;
                return A - B;
            });
            modelSel.innerHTML = "";
            for (const m of models) {
                const opt = document.createElement("option");
                opt.value = m.name.replace(/^models\//, "");
                opt.textContent = m.name;
                modelSel.appendChild(opt);
            }
            if (models[0]) {
                modelSel.value = models[0].name.replace(/^models\//, "");
                log("picked model:", modelSel.value);
            } else {
                log("No models available for this key.");
            }
        }
        
        async function generate(prompt) {
            const model = modelSel.value;
            if (!model) throw new Error("No model selected. Click 加载模型列表 first.");
            const raw = await http("/api/generate", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ model, prompt })
            });
            const data = JSON.parse(raw);
            const parts = data?.candidates?.[0]?.content?.parts ?? [];
            let inline = null;
            for (const p of parts) {
                if (p.inlineData && p.inlineData.data) {
                    inline = p.inlineData.data;
                    break;
                }
            }
            if (!inline) {
                const text = parts.map(p => p.text).filter(Boolean).join(" ");
                throw new Error("No inlineData image returned. Text: " + (text || "(empty)"));
            }
            const mime = (parts.find(p => p.inlineData?.mimeType)?.inlineData?.mimeType) || "image/png";
            return `data:${mime};base64,` + inline;
        }
        
        document.getElementById("btnHealth").onclick = async () => {
            logEl.textContent = "";
            imgEl.removeAttribute("src");
            try { await health(); } catch(e){ log("ERROR:", String(e)); }
        };
        
        document.getElementById("btnLoadModels").onclick = async () => {
            logEl.textContent = "";
            imgEl.removeAttribute("src");
            try { await listModels(); } catch(e){ log("ERROR:", String(e)); }
        };
        
        document.getElementById("btnGen").onclick = async () => {
            imgEl.removeAttribute("src");
            try {
                const prompt = document.getElementById("prompt").value;
                log("Generating...");
                const dataUrl = await generate(prompt);
                imgEl.src = dataUrl;
                log("Done.");
            } catch(e) {
                log("ERROR:", String(e));
            }
        };
    </script>
</body>
</html>
